name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python scripts/verify_engine_distribution.py --check
      - run: python -m unittest discover -s tests -v
      - run: guardrails --help
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/verify_release.py dist/guardlens-*.whl --version "$(python -c 'from importlib.metadata import version; print(version("guardlens"))')"
